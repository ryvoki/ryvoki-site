<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/site.css">
  <title>Your order — Ryvoki</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <div class="bg"><div class="orb"></div></div>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/"><img src="/assets/img/logo.svg" alt="">RYVOKI</a>
      <nav class="nav-links">
        <a href="/" data-nav="home">Home</a>
        <a href="/projects/" data-nav="projects">Projects</a>
        <a href="/license/" data-nav="license">License</a>
        <a class="btn btn-sm btn-primary" href="#" data-nav-discord target="_blank" rel="noopener">Discord</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <div class="narrow card" data-order><div class="status-hero"><div class="spinner"></div></div></div>
  </main>
  <footer>
    <div class="wrap">
      <div>© <span data-year></span> Ryvoki · <span data-footer-note></span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="muted" style="margin-right:4px">Pay with</span><span data-crypto style="display:contents"></span></div>
    </div>
  </footer>
  <script>document.querySelector("[data-year]").textContent=new Date().getFullYear();</script>
  <script src="/assets/js/site.js"></script>
  <script src="/assets/js/order.js"></script>
</body>
</html>
