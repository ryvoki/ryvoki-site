<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/img/brand/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/site.css?v=mu2bt0tz">
  <link rel="stylesheet" href="/assets/css/course.css?v=mu2bt0tz">
  <title>Student portal — Ryvoki</title>
  <meta name="description" content="Log in with your course key to access the Mythic course lessons, your training plan and your 1-on-1 booking.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07080a">
</head>
<body>
  <div class="bg"><div class="orb"></div></div>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/" aria-label="Ryvoki home"><img class="brand-mark" src="/assets/img/brand/mark.png" alt="Ryvoki"></a>
      <nav class="nav-links">
        <a href="/" data-nav="home">Home</a>
        <a href="/course/" data-nav="course">Course</a>
        <a href="/projects/" data-nav="projects">Projects</a>
        <a href="/license/" data-nav="license">License</a>
        <a href="/contact/" data-nav="contact">Contact</a>
        <a class="btn btn-sm btn-primary" href="#" data-nav-discord target="_blank" rel="noopener">Discord</a>
      </nav>
    </div>
  </header>
  <script>document.querySelector('[data-nav="course"]').setAttribute("aria-current","page")</script>

  <main class="wrap">
    <div class="learn" data-learn>
      <div class="status-hero"><div class="spinner"></div><p class="muted">Loading your course…</p></div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <div class="foot-brand"><img src="/assets/img/brand/mark.png" alt=""><span>© <span data-year></span> Ryvoki · <span data-footer-note></span></span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="muted">Stuck? <a data-discord-link style="text-decoration:underline">Ask in the students channel</a>.</span></div>
    </div>
  </footer>
  <script>document.querySelector("[data-year]").textContent=new Date().getFullYear();</script>
  <script src="/assets/js/site.js?v=mu2bt0tz"></script>
  <script src="/assets/js/learn.js?v=mu2bt0tz"></script>
</body>
</html>
